<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="380" height="200" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="380" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="190" y1="40" x2="190" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="40" y1="140" x2="340" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="380" height="200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Base Card -->
  <rect x="8" y="8" width="364" height="184" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Subtle Chart Grid Lines -->
  <line x1="36" y1="155" x2="344" y2="155" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="36" y1="118" x2="344" y2="118" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="36" y1="81" x2="344" y2="81" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="36" y1="44" x2="344" y2="44" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Background Volume Bars -->
  <rect x="65" y="125" width="16" height="30" rx="3" fill="#E2E8F0" opacity="0.7"/>
  <rect x="120" y="105" width="16" height="50" rx="3" fill="#E2E8F0" opacity="0.7"/>
  <rect x="175" y="90" width="16" height="65" rx="3" fill="url(#barGrad2)" opacity="0.6"/>
  <rect x="230" y="68" width="16" height="87" rx="3" fill="url(#barGrad2)" opacity="0.75"/>
  <rect x="285" y="45" width="16" height="110" rx="3" fill="url(#barGrad1)" opacity="0.85"/>

  <!-- Shaded Area Under Trend -->
  <path d="M 45 145 Q 110 135, 160 102 T 270 58 L 335 40 L 335 155 L 45 155 Z" fill="url(#areaGrad)"/>

  <!-- Primary Trend Curve -->
  <path d="M 45 145 Q 110 135, 160 102 T 270 58 L 335 40" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Data Indicator Nodes -->
  <circle cx="45" cy="145" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="135" cy="118" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="215" cy="80" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="280" cy="54" r="4.5" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
  <circle cx="335" cy="40" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Floating Mini Status Card 1 -->
  <g transform="translate(36, 22)">
    <rect width="92" height="28" rx="7" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="4" fill="#22C55E"/>
    <rect x="24" y="9" width="56" height="4" rx="2" fill="#64748B"/>
    <rect x="24" y="16" width="38" height="3" rx="1.5" fill="#94A3B8"/>
  </g>

  <!-- Floating Mini Status Card 2 -->
  <g transform="translate(244, 142)">
    <rect width="100" height="28" rx="7" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="4" fill="#2563EB"/>
    <rect x="24" y="9" width="62" height="4" rx="2" fill="#0F172A"/>
    <rect x="24" y="16" width="44" height="3" rx="1.5" fill="#2563EB"/>
  </g>
</svg>
