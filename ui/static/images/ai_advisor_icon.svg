<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <!-- Minimal Chat Bubble Container -->
  <path d="M28 8C16.954 8 8 16.507 8 27c0 4.22 1.442 8.12 3.882 11.268L10 46l8.472-2.118C21.205 45.187 24.496 46 28 46c11.046 0 20-8.507 20-19S39.046 8 28 8z" fill="url(#advisor_grad)" />
  
  <!-- Subtle Neural Network / AI Motif Inside Bubble -->
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Neural Connection Lines -->
    <line x1="28" y1="21" x2="20" y2="28" opacity="0.6" />
    <line x1="28" y1="21" x2="36" y2="28" opacity="0.6" />
    <line x1="20" y1="28" x2="25" y2="35" opacity="0.6" />
    <line x1="36" y1="28" x2="31" y2="35" opacity="0.6" />
    <line x1="28" y1="21" x2="28" y2="29" opacity="0.75" />
    <line x1="28" y1="29" x2="25" y2="35" opacity="0.75" />
    <line x1="28" y1="29" x2="31" y2="35" opacity="0.75" />
    
    <!-- Outer Connected Nodes -->
    <circle cx="28" cy="21" r="2.5" fill="#FFFFFF" />
    <circle cx="20" cy="28" r="2.2" fill="#FFFFFF" />
    <circle cx="36" cy="28" r="2.2" fill="#FFFFFF" />
    <circle cx="25" cy="35" r="2.2" fill="#FFFFFF" />
    <circle cx="31" cy="35" r="2.2" fill="#FFFFFF" />
    
    <!-- Central AI Core Node -->
    <circle cx="28" cy="29" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" />
  </g>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="advisor_grad" x1="8" y1="8" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>
</svg>
